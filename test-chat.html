<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmofy Agent Tester</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #090b12; color: #eef1ff; }
    main { width: min(900px, 100%); min-height: 100vh; margin: auto; padding: 24px; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0 auto 0 0; font-size: 20px; }
    input, textarea, button { font: inherit; }
    #key { width: min(360px, 100%); padding: 10px 12px; border: 1px solid #303650; border-radius: 10px; background: #121625; color: inherit; }
    #messages { min-height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 8px 0; }
    .message { max-width: 82%; padding: 12px 15px; border-radius: 16px; line-height: 1.55; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: #6c5ce7; color: white; }
    .assistant { align-self: flex-start; background: #151a2b; border: 1px solid #282f49; }
    .assistant > :first-child { margin-top: 0; }
    .assistant > :last-child { margin-bottom: 0; }
    pre { overflow-x: auto; padding: 12px; background: #090b12; border-radius: 8px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    a { color: #9da8ff; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    textarea { resize: none; min-height: 48px; max-height: 180px; padding: 13px; border: 1px solid #303650; border-radius: 12px; background: #121625; color: inherit; }
    button { height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #7c6df2; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { width: 100%; color: #99a2bf; font-size: 13px; }
    @media (max-width: 600px) { main { padding: 14px; } .message { max-width: 92%; } header { align-items: stretch; } #key { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Cosmofy Agent Tester</h1>
      <input id="key" type="password" autocomplete="off" placeholder="LiteLLM virtual key">
      <div id="status">Ready</div>
    </header>

    <section id="messages" aria-live="polite"></section>

    <form id="chat-form">
      <textarea id="prompt" placeholder="Ask Cosmofy anything…" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const endpoint = "https://swift.arryan.xyz/a2a/6e96e8e6-2f24-4078-9a96-db393af8913d";
    const form = document.querySelector("#chat-form");
    const prompt = document.querySelector("#prompt");
    const keyInput = document.querySelector("#key");
    const messages = document.querySelector("#messages");
    const send = document.querySelector("#send");
    const status = document.querySelector("#status");

    keyInput.value = sessionStorage.getItem("litellm-key") ?? "";
    marked.setOptions({ gfm: true, breaks: true });

    function addMessage(role, text = "") {
      const element = document.createElement("article");
      element.className = `message ${role}`;
      if (role === "assistant") {
        element.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        element.textContent = text;
      }
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
      return element;
    }

    function renderMarkdown(element, markdown) {
      element.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
      messages.scrollTop = messages.scrollHeight;
    }

    function textParts(parts = []) {
      return parts.map(part => part.text ?? part.root?.text ?? "").join("");
    }

    function readAgentEvent(event) {
      const result = event.result ?? event.params ?? event;
      const update = result.artifactUpdate ?? result.artifact_update ?? result;
      if (update.artifact?.parts) {
        return { text: textParts(update.artifact.parts), append: update.append !== false };
      }
      const task = result.task ?? result;
      if (task.artifacts?.length) {
        return {
          text: task.artifacts.flatMap(artifact => artifact.parts ?? []).map(part => part.text ?? "").join(""),
          append: false,
        };
      }
      return null;
    }

    async function streamAgent(userText, key, output) {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${key}`,
          "Content-Type": "application/json",
          "Accept": "application/x-ndjson",
        },
        body: JSON.stringify({
          jsonrpc: "2.0",
          id: crypto.randomUUID(),
          method: "message/stream",
          params: {
            message: {
              role: "user",
              messageId: crypto.randomUUID(),
              parts: [{ kind: "text", text: userText }],
            },
          },
        }),
      });

      if (!response.ok) {
        throw new Error(`${response.status}: ${await response.text()}`);
      }
      if (!response.body) throw new Error("Streaming response body is unavailable.");

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let answer = "";

      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value ?? new Uint8Array(), { stream: !done });
        const lines = buffer.split("\n");
        buffer = done ? "" : lines.pop();

        for (const rawLine of lines) {
          const line = rawLine.trim().replace(/^data:\s*/, "");
          if (!line || line === "[DONE]") continue;
          const event = JSON.parse(line);
          if (event.error) throw new Error(event.error.message ?? JSON.stringify(event.error));
          const chunk = readAgentEvent(event);
          if (!chunk?.text) continue;
          answer = chunk.append ? answer + chunk.text : chunk.text;
          renderMarkdown(output, answer);
        }
        if (done) break;
      }

      if (!answer) throw new Error("The agent returned no text.");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const userText = prompt.value.trim();
      const key = keyInput.value.trim();
      if (!userText || !key) {
        status.textContent = "Enter a virtual key and a message.";
        return;
      }

      sessionStorage.setItem("litellm-key", key);
      addMessage("user", userText);
      const output = addMessage("assistant", "_Thinking…_");
      prompt.value = "";
      send.disabled = true;
      status.textContent = "Streaming…";

      try {
        await streamAgent(userText, key, output);
        status.textContent = "Done";
      } catch (error) {
        renderMarkdown(output, `**Error:** ${error.message}`);
        status.textContent = "Failed";
      } finally {
        send.disabled = false;
        prompt.focus();
      }
    });

    prompt.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
